name: Deploy to Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - shared
          - production

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  setup:
    name: Detect targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        run: |
          SHARED='{"name":"shared","dir":"terraform/shared","environment":"shared","build":false}'
          PRODUCTION='{"name":"production","dir":"terraform","environment":"production","build":true}'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          else
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              CHANGED=$(git ls-files)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
            while IFS= read -r f; do
              [[ "$f" == terraform/shared/* ]] && ENV=shared
              [[ "$f" == /* && "$f" == terraform/* && "$f" != terraform/shared/* ]] && ENV=production
            done <<< "$CHANGED"
          fi

          case "$ENV" in
            shared)     TARGETS="[$SHARED]" ;;
            production) TARGETS="[$PRODUCTION]" ;;
            *)          TARGETS="[$SHARED,$PRODUCTION]" ;;
          esac

          echo "$TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  deploy:
    name: Apply — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.targets != '[]'
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format
        id: fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: ${{ matrix.dir }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ matrix.dir }}
        run: terraform apply -auto-approve

      - name: Print outputs
        working-directory: ${{ matrix.dir }}
        run: terraform output
